# Isoba · данные раз в день: входы FRED и GPR → проверка движка → коммит isoba/data.json и isoba/history.json.
# Каждый коммит — публичная запись с датой того, что показывал индекс. Движок — isoba/engine/.
name: isoba-data

on:
  schedule:
    - cron: '17 13 * * 2-6'        # 13:17 UTC, вт–сб: данные рабочего дня США уже на FRED
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isoba-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Пакеты
        run: pip install pandas==3.0.5 numpy==2.5.3 xlrd==2.0.2

      - name: Входы
        run: python isoba/engine/fetch.py

      - name: Проверка
        run: python isoba/engine/verify.py

      - name: Расчёт
        run: python isoba/engine/isoba.py

      - name: Коммит
        run: |
          git config user.name "Tommy"
          git config user.email "dexterrion.com@gmail.com"
          git add isoba/data.json isoba/history.json
          if git diff --cached --quiet; then echo "данные не изменились"; exit 0; fi
          ASOF=$(python -c 'import json; print(json.load(open("isoba/data.json", encoding="utf-8"))["asof"])')
          git commit -q -m "Isoba: данные на $ASOF"
          git push
